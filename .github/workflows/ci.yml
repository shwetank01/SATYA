name: CI

# Every language must pass the same shared vectors in spec/ (Section 0 rule 5).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracles:
    name: Python oracles + VIVEK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python spec/reference/rules_ref.py spec/satya_bank_promises.json spec/rule_cases.json
      - run: python spec/reference/mask_ref.py spec/mask_vectors.json
      - run: python spec/reference/pay_ref.py spec/paycheck_cases.json
      - run: pip install fastapi httpx numpy pillow av pytest
      - run: python -m pytest vivek/tests -q

  web:
    name: TypeScript (lib, SQL on PGlite, console build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx vitest run
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  workers:
    name: Cloudflare workers (satya-ai, SETU)
    runs-on: ubuntu-latest
    strategy:
      matrix: { dir: [ai-worker, setu] }
    defaults: { run: { working-directory: '${{ matrix.dir }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx vitest run

  android-core:
    name: Kotlin core (JVM) + one-door guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests against spec vectors
        working-directory: android
        run: ./gradlew :core:test --console=plain
      - run: bash tools/check_one_door.sh
